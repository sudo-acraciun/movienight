<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy Policy — I Like Movies</title>
  <!--
    Redirect stub. The policy itself now lives at ilikemovies.app/privacy.
    This URL cannot be retired: it is compiled into every app build that has
    not taken an over-the-air update, and those installs do not expire.

    GitHub Pages serves static files only, so a real 301 is not available
    here. A zero-delay meta refresh moves the reader, and rel=canonical is
    what consolidates the two addresses for a crawler. Deliberately no
    noindex: it would contradict the canonical rather than reinforce it.
  -->
  <link rel="canonical" href="https://ilikemovies.app/privacy">
  <meta http-equiv="refresh" content="0; url=https://ilikemovies.app/privacy">
  <style>
    :root { color-scheme: dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0A0D14; color:#E5E7EB; margin:0; padding:32px 20px; line-height:1.6; }
    .wrap { max-width:520px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 12px; color:#fff; }
    a { color:#F5C518; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>This page has moved</h1>
  <p>The I Like Movies privacy policy is now at <a href="https://ilikemovies.app/privacy">ilikemovies.app/privacy</a>.</p>
  <p>You should be taken there automatically. If nothing happens, follow the link above.</p>
</div>
</body>
</html>
